# HeiPorSPECTRAL subset (CC BY 4.0, doi:10.1038/s41597-023-02315-8). See docs/DATA.md.
dataset:
  name: HeiPorSPECTRAL
  url: https://e130-hyperspectal-tissue-classification.s3.dkfz.de/data/HeiPorSPECTRAL.zip
  # Guard against the remote archive changing under us.
  expected_size: 907375987596
  archive_prefix: HeiPorSPECTRAL/

paths:
  raw_dir: data/raw            # zip members are mirrored here, keeping archive paths
  cache_dir: data/raw/.cache   # central directory + per-image meta.json
  manifest: configs/subset_heiporspectral.json  # tracked: the exact list of images used

selection:
  angle: 0          # preferred camera angle
  repetition: 1     # preferred repetition
  max_per_pair: 4   # one per situs -> up to 4 images per (pig, organ)
  annotators: [annotator1, annotator2, annotator3]

download:
  workers: 4
  chunk_mb: 8

processing:
  processed_dir: data/processed
  bin_factor: 2            # 480x640 -> 240x320
  label_source: annotator1 # annotator1 | majority (>= 2 of 3 annotators)
  workers: 6

# Pig-level split. train = every subject not listed. Checked: all 20 organs occur in val and
# in test, and each organ occurs in >= 4 training pigs.
split:
  val: [P093, P094]
  test: [P095, P096]

# Spectral input settings ("band settings") compared throughout the project.
bands:
  full:
    method: identity       # 100 channels, 500-1000 nm
  snapshot16:
    method: box            # box | gaussian | select
    n_bands: 16
    fwhm_nm: 20            # used by gaussian only

normalization: l1          # l1 | l1_standardize | l1_snv  (see src/hsi/data/normalize.py)
