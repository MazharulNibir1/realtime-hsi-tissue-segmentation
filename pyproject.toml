[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-tissue"
version = "0.1.0"
description = "Real-time-oriented tissue classification on surgical hyperspectral imaging (full spectrum vs simulated 16-band snapshot sensor)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.3",
    "pyyaml>=6.0",
    "blosc2>=2.5",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxconverter-common>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
    "black>=26.1",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "app"]
extend-exclude = ["notebooks", "web", "data", "mlruns", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.isort]
known-first-party = ["hsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
